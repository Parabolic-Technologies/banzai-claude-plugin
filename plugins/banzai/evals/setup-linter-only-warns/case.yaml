schema_version: "1.1"
name: setup-linter-only-warns
description: A typed /banzai:setup in a project whose linter only warns about complexity shows the limits as errors and leaves the configuration alone.
tags: [setup]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/banzai:setup"
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, AskUserQuestion, TodoWrite]
graders:
  - name: work-directory-created
    type: file_exists
    path: 'documentation/work/.gitkeep'
  # The whole file, as the scaffold script wrote it.
  - name: configuration-untouched
    type: regex
    target: { source: file, path: eslint.config.mjs }
    pattern: '^import js from ''@eslint/js'';\n\nexport default \[\n  js\.configs\.recommended,\n  \{ rules: \{ complexity: \[''warn'', 15\] \} \},\n\];\n$'
  - name: no-install-command
    type: tool_used
    tool: Bash
    input_match: '\b(npm (i|install|add)|pnpm add|yarn add)\b'
    min: 0
    max: 0
  # The three below read the last message, which shows the lines to add.
  # They know how ESLint spells a rule and a severity. The first also asks
  # for the value the configuration already had.
  - name: complexity-becomes-an-error-at-15
    type: regex
    pattern: 'complexity\W?\s*:\s*\[\s*\W?(error\W?|2)\s*,\s*(\{\s*max\W?\s*:\s*)?15\b'
  - name: function-length-limit-is-an-error
    type: regex
    pattern: 'max-lines-per-function\W?\s*:\s*\[?\s*\W?(error|2)\b'
  - name: file-length-limit-is-an-error
    type: regex
    pattern: 'max-lines\W?\s*:\s*\[?\s*\W?(error|2)\b'
  - name: names-what-is-missing
    type: llm
    criteria: >-
      PASS if the final message says that the project's linter only warns
      about complexity or lacks limits, and shows configuration lines that
      set limits. FAIL if it says nothing about the linter's limits.
